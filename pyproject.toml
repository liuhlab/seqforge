[project]
name = "seqforge"
description = "Compile arbitrary FASTQ + messy metadata into a validated, machine-independent sequencing library manifest and a runnable Snakemake config."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Liu Lab" }]
keywords = ["bioinformatics", "single-cell", "fastq", "snakemake", "manifest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# CalVer YYYY.M.PATCH, mirrored in CHANGELOG.md.
version = "2026.7.1"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6",
    "numpy>=2",
    "pooch>=1.8",
    "requests>=2.31",
    "tqdm>=4",
    # The document readers are hard dependencies, not extras: `read_document` advertises these
    # formats and a paper is the normal shape of the prose seqforge is handed.
    "pypdf>=4",
    "PyMuPDF>=1.24",     # default PDF backend; AGPL-3.0, the one non-permissive dep
    "pdfplumber>=0.11",  # in-text tables -> markdown, so a table cell greps back
    "openpyxl>=3.1",     # supplementary .xlsx sample tables
    "anndata>=0.10",     # the pilot's deliverable format
    # `harvest extract` is the one stage that touches an LLM; both clients are lazy-imported, and
    # `run --no-llm` drives the whole compiler without them.
    "anthropic>=0.40",
    "openai>=1.40",      # any OpenAI-compatible endpoint (DeepSeek, vLLM, Ollama, ...)
    # liulab-genome and liulab-data are deliberately absent: PyPI rejects a distribution whose
    # metadata carries a `git+https` reference. They are declared in the pixi tables below, which
    # never fold into the wheel. A PyPI user who wants the lab-only features installs them from git:
    #     pip install "liulab-genome @ git+https://github.com/liuhlab/liulab-genome.git" \
    #                  "liulab-data   @ git+https://github.com/liuhlab/liulab-data.git"
]

[project.urls]
Homepage = "https://github.com/liuhlab/seqforge"
Issues = "https://github.com/liuhlab/seqforge/issues"
Changelog = "https://github.com/liuhlab/seqforge/blob/main/CHANGELOG.md"

[project.scripts]
seqforge = "seqforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No `force-include`: this already carries every non-Python file under the tree (onlists, .smk
# modules, KB specs, report assets), and adding one is a hard build error. Verified by
# `test_the_wheel_ships_the_data_the_package_cannot_work_without`.
packages = ["src/seqforge"]

# No `[tool.hatch.metadata] allow-direct-references`, on purpose: its absence is a tripwire, so
# re-adding a git dependency above fails the build rather than a later PyPI upload.

# -------- pixi --------

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
seqforge = { path = ".", editable = true }
# Consumers, not a parallel universe. `rule genome_index` resolves the STAR index in a `run:`
# directive and `kb e2e` uses it to find a reference; `io/archive.py` calls labdata's
# `experiments_for` for the accession -> SRA-experiments hop. Both ship in liulab-runtime's `lab`
# feature, so this adds no environment the cluster lacks.
liulab-genome = { git = "https://github.com/liuhlab/liulab-genome.git" }
liulab-data = { git = "https://github.com/liuhlab/liulab-data.git" }

[tool.pixi.dependencies]
pydantic = ">=2.7"
pyyaml = ">=6"
numpy = ">=2"
pooch = ">=1.8"
typer = ">=0.12"
requests = ">=2.31"
tqdm = ">=4"
pypdf = ">=4"
openpyxl = ">=3.1"
anndata = ">=0.10"
anthropic = ">=0.40"
openai = ">=1.40"
pymupdf = ">=1.28.0,<2"
pdfplumber = ">=0.11.10,<0.12"
# liulab-genome's transitive needs, mirrored from liulab-runtime's `lab` feature. A missing one is
# an ImportError at `import genome`, not a wrong number.
pandas = ">=2.1,<3"
gffutils = "*"
ucsc-fatotwobit = "*"
ucsc-twobitinfo = "*"

# The DAG builder, so compose's wiring gate actually runs rather than skipping green. `minimal`
# because no executor plugin is wanted — submitting jobs is the user's. STAR and samtools are
# deliberately in no table here; liulab-runtime provides them and the rules name its image.
[tool.pixi.feature.wf.dependencies]
snakemake-minimal = ">=8"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"
pre-commit = "*"
python-build = "*"
types-pyyaml = "*"
types-requests = "*"
types-openpyxl = "*"
pyinstrument = ">=5.1.2,<6"

[tool.pixi.feature.docs.dependencies]
mkdocs-material = "*"

[tool.pixi.environments]
default = { features = ["py313", "dev", "test", "docs", "wf"], solve-group = "default" }
test    = { features = ["py313", "test", "wf"], solve-group = "default" }
docs    = { features = ["py313", "docs"], solve-group = "default" }

[tool.pixi.tasks]
lint      = "ruff check ."
fmt       = "ruff format ."
fmt-check = "ruff format --check ."
# Strict, and scoped to the modules where a wrong type poisons the corpus or an emitted param.
typecheck = "mypy src/seqforge/models src/seqforge/probe src/seqforge/resolve src/seqforge/manifest src/seqforge/compose src/seqforge/workflows src/seqforge/harvest src/seqforge/fingerprint src/seqforge/report src/seqforge/evals"
# `auto` capped at 12: bare `auto` is slower on a big box (48 workers lose to 12), a bare number is
# wrong on a 2-core runner. `loadgroup` behaves like the default for unmarked tests and groups only
# those carrying `xdist_group`. Measurements: docs/agents/testing.md.
test      = "pytest -n auto --maxprocesses 12 --dist=loadgroup"
# Drops what needs a binary we do not own and what checks the repo. Not a rung of the ladder — it is
# what you want on a machine with no snakemake.
test-fast   = "pytest -m 'not external and not repo' -n auto --maxprocesses 12 --dist=loadgroup -q"
# Serial on purpose: 12 workers to re-run three tests costs more than it saves, and `-x` is
# unreliable under xdist.
test-failed = "pytest --lf --new-first -x -q"
test-cov  = "pytest --cov=seqforge --cov-report=term-missing"
# The networked validation benchmark, not part of `check`. Exits 3 on any false-accept; an
# unreachable benchmark package skips. Invoked by the opt-in benchmark workflow.
eval      = "seqforge eval run"
# Not `depends-on`: pixi runs those sequentially and the four checks share no inputs. `check.sh`
# runs them concurrently and prints each one's output whole, in a fixed order.
check     = "bash scripts/check.sh lint fmt-check typecheck test"
build     = "python -m build"
# Runs in the CI `build` job, where the wheel already exists — as a test it built a second one.
check-wheel = "python scripts/check_wheel_contents.py"
install-skills = "python skills/install.py --user"
docs      = "mkdocs serve"
docs-build = "mkdocs build --strict"

# -------- tool config --------

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
# E501: the formatter owns line length. UP046/UP047: keep classic Generic[T]/TypeVar, which has the
# better-tested pydantic-v2 + mypy support.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Imports the strict modules pull in but that are not themselves in scope (io/, kb/) are followed
# for types with their own errors silenced.
follow_imports = "silent"

# scipy ships no type information, and the type of `csr_matrix` is not what protects the
# deliverable — `test_the_matrix_is_transposed_to_cells_by_genes` is.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# pooch ships no `py.typed`. It is the download/cache layer under the onlist registry, reached
# through `retrieve()` in three places, and what protects the deliverable there is the checksum the
# registry asserts on the fetched file — not the type of the fetcher.
[[tool.mypy.overrides]]
module = ["pooch", "pooch.*"]
ignore_missing_imports = true

# Both PDF engines are incompletely typed, and we call each through one thin guarded function in
# `harvest/normalize.py`.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pinned: the default also collects `*_test.py`, which nothing here is named, so an untracked
# scratch file was collected locally and absent in CI.
python_files = ["test_*.py"]
# `zarr` and `anyio` arrive transitively (anndata, httpx) and each registers a `pytest11` entry
# point every worker imports at startup, though no test here uses either.
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-p", "no:zarr",
  "-p", "no:anyio",
]
xfail_strict = true
filterwarnings = ["error"]
# Both markers are semantic, not speed: what a test needs, and what it is about. A `slow` marker was
# rejected — a hand-maintained list keyed on a number that changes whenever you optimise.
markers = [
  "external: needs a binary seqforge does not own (snakemake/STAR/htslib/build)",
  "repo: checks repo consistency, not src/ behaviour",
]

[tool.coverage.run]
branch = true
source = ["src/seqforge"]
