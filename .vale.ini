# Rules live in styles/Lab/, tracked — so `styles/` is not in .gitignore. Copied from the lab
# template; change a cap or a rule there, not here.
#
# EVERY RULE IS NAMED IN EVERY SECTION. Vale's `*` matches `/`, so sections overlap and
# per-rule settings accumulate, later sections winning. An omitted rule keeps whatever an
# earlier section said, which once left ADRs checked by nothing on green CI. Broad section
# first. The caps are explained in docs/agents/writing.md.

StylesPath = styles
MinAlertLevel = error

# 1. Human-facing: the published site, and the KB assay READMEs it includes. Uncapped.
[{README.md,CHANGELOG.md,docs/**/*.md,src/seqforge/kb/specs/**/README.md}]
BasedOnStyles = Lab
Lab.Jargon = YES
Lab.Readability = YES
Lab.LengthDoc = NO
Lab.LengthAdr = NO

# 2. Agent-facing: word budget only. The glossaries are not here — see section 5.
[{AGENTS.md,docs/agents/**/*.md,skills/**/SKILL.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = YES
Lab.LengthAdr = NO

# 3. Decision records, system-wide and per-context: the tighter cap.
[{docs/adr/**/*.md,src/seqforge/*/docs/adr/*.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = YES

# 4. Research notes: uncapped, and exempt from jargon because a note quotes what it argues
# against.
[docs/research/**/*.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = NO

# 5. The glossaries — the root map and one per context: no file cap. A glossary grows one term
# at a time and never shrinks, so a file-level word count measures the size of the domain, not
# the quality of the writing. Last because it is the narrowest pattern here, and the later
# section wins.
[{GLOSSARY-MAP.md,src/seqforge/*/GLOSSARY.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthAdr = NO
