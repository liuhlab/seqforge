name: Docs

# Publishes the MkDocs site to the `gh-pages` branch on every push to main.
# Mirrors liulab-runtime's mechanism (a gh-pages branch), not liulab-genome's (a Pages artifact):
# the two siblings differ, and CLAUDE.md's own wording says gh-pages.
#
# Publishing only. Whether the site BUILDS is asked on every PR by ci.yml's lint job, which runs the
# same `--strict` build on the `default` environment. That split is the point: this workflow holds
# `contents: write` and pushes a branch, so no trigger a pull request can fire may ever appear below.
#
# Setup (one-off, by a maintainer):
#   1. Let this workflow run once so it creates the `gh-pages` branch.
#   2. Settings -> Pages -> Source: "Deploy from a branch".
#   3. Branch: `gh-pages`, folder: `/ (root)`. Save.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          locked: true
      # The committer of the gh-pages commit. ghp-import, which gh-deploy calls, reads these before
      # git's config, so no step has to write that config.
      - name: mkdocs gh-deploy
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pixi run -e docs docs-deploy
