name: CI

# THE mechanism. Most of seqforge's non-negotiable rules are enforced by tests (the parse/count line,
# the KB round-trip over every spec, the rung-0-2 separability guard, the read/byte budget), and
# nothing else runs them automatically: pre-commit deliberately carries only the fast hooks, so a red
# commit can exist on a branch. This is where it is caught -- and on a machine that is not yours.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: ruff (lint)
        run: pixi run -e default lint
      - name: ruff format check
        run: pixi run -e default fmt-check
      - name: mypy --strict
        run: pixi run -e default typecheck
      # Does the SITE build: a dead internal link, a nav entry naming a file that moved, a snippet
      # include whose target was renamed. `markdownlint` sees none of those -- it reads one file's
      # prose style, never the graph between files. Until this step existed the strict build ran
      # only on push-to-main, so a PR broke it and the next pusher owned the red.
      #
      # Folded in here rather than given a fifth runner: `default` already carries the `docs` feature
      # (pyproject's [tool.pixi.environments]), so this reuses the setup-pixi above and its whole
      # marginal cost is the build -- 1.7s measured end to end, against ~28s for another setup-pixi.
      # Last in the job because it is the only step that writes (`site/`, gitignored).
      #
      # Build, never publish. Deploying stays in docs.yml, the only workflow granted
      # `contents: write` and unreachable from a pull_request; this workflow is read-only throughout.
      - name: mkdocs build --strict
        run: pixi run -e default docs-build

  # markdownlint is a Node tool, so it runs on its own runner rather than through pixi. It lints the
  # human-facing docs (the site pages, the KB assay READMEs that render into them, and the top-level
  # README) per `.markdownlint-cli2.yaml`; running with no file args makes cli2 read the globs/ignores
  # from that config. Pinned so a new rule cannot turn CI red without a deliberate bump.
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint (docs + README)
        run: npx --yes markdownlint-cli2@0.23.1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
          locked: true
      - name: pytest
        run: pixi run -e test test

  # The `external` tests -- the ones needing a binary seqforge does not own. Until this job existed
  # the marker meant three different things: snakemake is a dependency, so those ran in the job above;
  # bgzip/tabix are not, so the fragments test skipped here and passed only on a developer box that
  # happened to carry htslib; and the STAR test -- the end-to-end proof that a UMI tag put on a read
  # survives into the aligner's own output -- ran on no host this project's CI can reach, ever. A skip
  # is green, so nothing was ever red about a claim nothing was checking. See #333.
  #
  # The binaries come from LIULAB-RUNTIME, which owns them, and seqforge declares none of them: an
  # alignment environment is the runtime's to define and this project's only to name.
  # The first attempt at this job declared `star`/`samtools`/`htslib` in a pixi feature of our own; it
  # falsified four shipped comments, and it could not be solved on `osx-arm64` at all, so it had to be
  # pinned to one platform and the maintainer could not build it. Checking out the owner's repo and
  # borrowing its already-locked `align-rna` environment costs one clone and needs no table here. See
  # #338.
  #
  # `test` is the environment, exactly as the job above builds it -- the only difference between the
  # two jobs is what is on PATH. So this DOES re-run the snakemake-gated externals the `test` job
  # already ran, and that duplication is deliberate: deselecting them here or excluding them there
  # would make the main job's selection a function of what this job happens to cover.
  #
  # `liulab-runtime` is public, so no token; `--filter=blob:none` because only pyproject.toml and
  # pixi.lock are read. Pinned to `main` and not a SHA on purpose -- the point is to track what the
  # owner actually ships, and a pin here would be this repo deciding an aligner version by the back
  # door, which is the whole thing being undone.
  test-external:
    name: test (external binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check out liulab-runtime (the owner of the aligner environment)
        uses: actions/checkout@v5
        with:
          repository: liuhlab/liulab-runtime
          ref: main
          path: .liulab-runtime
          filter: blob:none
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
          locked: true
      - name: build liulab-runtime's align-rna environment
        run: pixi install -e align-rna --locked --manifest-path .liulab-runtime/pyproject.toml
      - name: pytest -m external
        # The binaries on PATH, the Python from `test`. `pixi run` prepends its own prefix and
        # inherits the rest of PATH, so STAR/samtools/bgzip/tabix stay reachable from inside it.
        run: |
          export PATH="$PWD/.liulab-runtime/.pixi/envs/align-rna/bin:$PATH"
          STAR --version && samtools --version | head -1 && bgzip --version | head -1
          pixi run -e test test-external

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: build
        run: pixi run -e default build
      # The wheel exists now, so inspect it here rather than build a second one under pytest. The
      # package data is not Python -- if `io/onlists/*.codes.gz`, the `.smk` modules, the KB specs or
      # the report assets fall out of the wheel, every real dataset breaks while the unit suite (which
      # reads the source tree) stays green. See scripts/check_wheel_contents.py and #108.
      - name: wheel ships its package data
        run: pixi run -e default check-wheel
