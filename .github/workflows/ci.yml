# The gate, run on the pull request rather than on the branch.
#
# THE mechanism. Most of seqforge's non-negotiable rules are enforced by tests (the parse/count line,
# the KB round-trip over every spec, the rung-0-2 separability guard, the read/byte budget), and
# nothing else runs them automatically: pre-commit deliberately carries only the fast hooks, so a red
# commit can exist on a branch. This is where it is caught -- and on a machine that is not yours.
#
# ONE job, because GitHub bills every job rounded up to a whole minute: several short jobs bill
# far more than one longer one. Every step after the first gate step runs even when one before it
# failed, so a run still reports every failure.
#
# Every step invokes `pixi run <task>` and never a command line. Conformance rule
# `workflow-step-tasks` holds every workflow in the repo to it; a step may pass arguments after
# `--`, and the rule prints them rather than forbidding them.
name: CI

on:
  # `pull_request` tests the MERGE commit — the code that will exist after the merge, not the
  # branch tip — and it is the only event that produces a run for a pull request from a fork.
  # Nothing runs on a push to `main`: it would test again what the pull request just tested.
  # `workflow_dispatch` is for checking `main` by hand.
  #
  # `ready_for_review` is listed because a draft runs nothing (the job's `if:` below): open a
  # pull request as a draft, pass the local gate, then mark it ready to run CI once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Keyed on the workflow and the ref, so pushing again to a pull request cancels the run it
# supersedes. A run started by hand is never cancelled.
concurrency:
  # The draft state is part of the key: a draft's run is skipped, and must not cancel the
  # real run that marking the pull request ready starts in the same second.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Skipped on a draft, which bills nothing. A run by hand has no pull request, so it runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # A real checkout, not a source archive: `conformance` shells out to `git ls-files`
      # and exits 2 without a `.git` — its "could not run", spelled apart from the 1 a
      # broken rule exits, so a bad checkout never reads as a rule this repo failed.
      - uses: actions/checkout@v7
        with:
          # Full history, because `build` needs the tags: the version is dynamic and
          # hatch-vcs reads the newest tag, so a shallow clone would stamp a released commit
          # as a dev build.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # `default` carries the test, docs and wf features, so every lane and both prose linters
          # run in it. `test-star` holds the aligner the external lane needs on PATH; `dist` holds
          # the build frontend and twine, and solves alone.
          environments: >-
            default
            test-star
            dist
          # Fail if `pixi.lock` no longer matches `pyproject.toml`, rather than silently
          # solving something else. This is what makes CI run the versions the laptop ran.
          locked: true
      # lint, fmt-check, mypy and conformance, concurrently through `check.sh`.
      - run: pixi run check-static
      # THREE LANES, AND TOGETHER THEY ARE THE SUITE: `-m external` against `-m 'not external'`,
      # and the corpus one file, so no test falls between them. The task table owns which selection
      # is which. `--durations=10` because a lane's wall is set by one indivisible item, and printing
      # it makes that floor visible in every log; it is a measurement, not a gate.
      - run: pixi run test -- --durations=10
        if: ${{ !cancelled() }}
      # The hermetic corpus: every case in `evals/cases/` through the real compiler, no LLM and no
      # network. The networked tier is not this; it lives in `benchmark.yml` and runs on release.
      - run: pixi run test-corpus -- --durations=10
        if: ${{ !cancelled() }}
      # The tests needing a binary seqforge does not own. The task proves the binaries answer before
      # it selects anything (`require-binaries`), so a missing `test-star` is red, not a green skip.
      - run: pixi run test-external -- --durations=10
        if: ${{ !cancelled() }}
      # Outside `pixi run check`, for the reason AGENTS.md gives: each answers a question a code
      # change does not ask.
      - run: pixi run markdownlint
        if: ${{ !cancelled() }}
      - run: pixi run vale
        if: ${{ !cancelled() }}
      # Does the SITE build: a dead internal link, a nav entry naming a file that moved, a snippet
      # include whose target was renamed. Build, never publish: deploying stays in docs.yml.
      - run: pixi run docs-build
        if: ${{ !cancelled() }}
      - run: pixi run build
        id: build
        if: ${{ !cancelled() }}
      # The wheel exists now, so inspect it here rather than build a second one under pytest. If
      # the package data falls out of the wheel, every real dataset breaks while the unit suite
      # (which reads the source tree) stays green.
      - run: pixi run check-wheel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      # The release job runs this too; here it fails on the pull request, not on release day.
      - run: pixi run check-dist
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v7
        # Only a wheel that was built: a failed build would otherwise fail this step too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: dist
          path: dist/
          # An empty upload is a green step that proved nothing.
          if-no-files-found: error
