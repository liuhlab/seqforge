# Hand reading (gold) of GSE164798. Shape: ../SCHEMA.md. Additions: sample `title`; `unsure` items are {label, note}.
study:
  series: ["GSE164798"]
  superseries: null
  bioproject: ["PRJNA691970"]
  pmid: ["33804749"]
  notes: "A 2 x 3 crossed design: genotype (wild-type littermates, 5xFAD) by voluntary wheel running (sedentary, acute = one day or 18 h, chronic = 30 days). The baseline running level is spelled 'treatment: untreated' with 'treatment synonym: sedentary'. Running is not an ordered series: GEO gives regimens, not numbers, and the paper compares regimens. Acute vs chronic, which the paper also tests, is not a contrast under the rule because neither side is the baseline. Genotype leaks into the strain field ('5xFAD (C57BL/6)'). All mice male; RNA from the right hemisphere; the left hemisphere went to lactate assays and was not sequenced. GEO gives age 3 months for every sample; the summary's '2-month-old' for the chronic group is the age at the start of 30 days of running. GEO's 'one day' of running is '18 h before sacrifice' in the paper."
factors:
  - name: "genotype"
    levels: ["WT", "5xFAD"]
    baseline: "WT"
    ordered: false
  - name: "treatment"
    levels: ["sedentary", "acute", "chronic"]
    baseline: "sedentary"
    ordered: false
samples:
