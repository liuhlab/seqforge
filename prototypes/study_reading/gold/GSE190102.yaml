      sex: {text: "male", id: "PATO:0000384"}
      age: {text: "3 months"}
      tissue: {text: "forebrain", id: "UBERON:0001890"}
      cell_type: {text: "NeuN+ neuronal nuclei", id: "CL:0000540"}
      sample_type: {text: "tissue"}
      genotype: {text: "WT"}
    evidence:
