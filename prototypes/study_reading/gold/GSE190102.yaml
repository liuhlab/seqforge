# Hand reading (gold) of GSE190102. Shape: ../SCHEMA.md. Additions: sample `title`; `target`/`role`/`order`
# keys on contrasts and series; `basis` on background controls; `unsure` items are {label, note}.
study:
  series: ["GSE190102"]
  superseries: null
  bioproject: ["PRJNA798693"]
  pmid: ["39195281"]
  notes: "One Series, two deposits. The 28 samples of 2021 (H3K4me3, H3K27ac, total input) carry age and antibody as characteristics. The 15 H3K27me3 samples added in 2024 carry age and mark only in the title, their characteristics say 'tissue: brain; cell type: neurons; genotype: WT', and the Series overall design still names only H3K4me3 and H3K27ac. 'TI' in a title is total input; its antibody is 'None'. GEO has 6-month samples the paper never analyses (the paper says 3, 12 and 24 months, n = 5 per age). The title's leading number is the animal id, shared across marks, so one animal is one donor and one biosample. Strain is wild-type C57BL/6 throughout; genotype is not a factor."
factors:
  - name: "age"
    levels: ["3 months", "6 months", "12 months", "24 months"]
    baseline: "3 months"
    ordered: true
