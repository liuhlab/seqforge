# Hand reading (gold) of GSE206603. Shape: ../SCHEMA.md. Additions: sample `title` and `series`; `assay` key on
# contrasts; `unsure` items are {label, note}; an attribute NCBI has no name for carries 'unlisted: true'.
study:
  series: ["GSE206603", "GSE206602", "GSE206588"]
  superseries: "GSE206603"
  bioproject: ["PRJNA851445", "PRJNA851439", "PRJNA851435"]
  pmid: ["39754192"]
  notes: "SuperSeries of two SubSeries: RNA-seq (GSE206602) and ATAC-seq (GSE206588), 12 samples each, from neurons differentiated from four patient iPSC lines: one non-demented control and three familial AD mutations. Each genotype is one donor, so genotype is confounded with donor, sex and APOE; the three replicates per line are parallel differentiations, not people. Sex and APOE genotype sit in a field named 'treatment' ('M, APOE2/3'); there is no treatment. 'disease state' duplicates genotype (control vs AD) and is an attribute, not a second factor. Whether RNA replicate k and ATAC replicate k share a differentiation is not stated; see each sample's unsure note. No controls in either assay."
factors:
  - name: "genotype"
    levels: ["WT", "APP_V717I", "PSEN1_A79V", "PSEN2_N141I"]
    baseline: "WT"
    ordered: false
samples:
  - gsm: "GSM6257605"
    title: "NDC replicate 1 [RNA-seq]"
    series: "GSE206602"
    factors: {genotype: "WT"}
    biosample: "B01"
    donor: "D01"
    assay: "RNA-seq"
    target: null
    role: "signal"
    control_type: null
    attributes:
      species: {text: "Homo sapiens", id: "NCBITaxon:9606"}
      sex: {text: "male", id: "PATO:0000384"}
      apoe_genotype: {text: "APOE2/3", unlisted: true}
      disease: {text: "Non-demented Control", id: "PATO:0000461"}
      cell_type: {text: "hiPSC-derived neurons", id: "CL:0000540"}
      sample_type: {text: "in vitro differentiated cells"}
      genotype: {text: "WT"}
    evidence:
      genotype: {quote: "genotype: WT", source: "GSM characteristics"}
      disease: {quote: "disease state: Non-demented Control", source: "GSM characteristics"}
      sex:
        quote: "treatment: M, APOE2/3"
        source: "GSM characteristics (sex and APOE filed under 'treatment')"
      donor:
        quote: "n = 3 replicates differentiated in parallel from individual donor patients"
        source: "paper methods (PMC11699654)"
      biosample: {quote: "NDC replicate 1 [RNA-seq]", source: "GSM title"}
      assay: {quote: "library strategy: RNA-Seq", source: "GSM library strategy"}
    probability: {}
    unsure:
      - label: "biosample"
        note: "May share a biosample with GSM6257296 (ATAC-seq, same line, same replicate number). Neither GEO nor the paper says the RNA and ATAC replicates came from the same differentiation; the same lab's 2020 study of the same design had unequal replicate counts per assay (RNA n = 8, ATAC n = 5 for the control). Minted as separate biosamples; co-measurement is certain only at the donor (iPSC line) level."
