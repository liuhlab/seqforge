    donor:     {id: D4, text: IGF1_29, quoted: [17, 10], p: 0.85}
    treatment: {text: adenovector expressing rat IGF-I, quoted: [12, 1], p: 0.97}
  GSM2668019:
    biosample: {id: B5, inferred: "four rats and four samples per group (passage 10), so one hippocampus per library", p: 0.9}
    donor:     {id: D5, text: DsRed_7, quoted: [18, 10], p: 0.85}
    treatment: {text: adenovector with empty vector DsRed, quoted: [13], p: 0.97}
  GSM2668020:
    biosample: {id: B6, inferred: "four rats and four samples per group (passage 10), so one hippocampus per library", p: 0.9}
    donor:     {id: D6, text: DsRed_12, quoted: [19, 10], p: 0.85}
