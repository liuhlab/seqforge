<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- PROTOTYPE, throwaway. A view-only gallery written by build_page.py: one picture per study. -->
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --ink:#1c2220; --muted:#5c6662; --line:#d9d7cd;
  --in:#0f6b63; --in-bg:#dcefeb; --out:#8d9692; --ss:#7a5a12; --link:#0f6b63;
  --differ:#b5541a; --unsure:#6d47b8; --warn-bg:#fff2cc; --warn-ink:#5e4300;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1b211f; --ink:#e4eae7; --muted:#9aa8a2; --line:#34403b;
  --in:#5fbab0; --in-bg:#173430; --out:#75827c; --ss:#d9b25a; --link:#7fd0c6;
  --differ:#f0935a; --unsure:#b79cf2; --warn-bg:#3a3115; --warn-ink:#f0d58a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1b211f; --ink:#e4eae7; --muted:#9aa8a2; --line:#34403b;
  --in:#5fbab0; --in-bg:#173430; --out:#75827c; --ss:#d9b25a; --link:#7fd0c6;
  --differ:#f0935a; --unsure:#b79cf2; --warn-bg:#3a3115; --warn-ink:#f0d58a; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,p{margin:0}
.notice{background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:13px;padding:6px 24px}
.top{padding:18px 24px 6px;max-width:1500px;margin:0 auto}
.top h1{font-size:21px}
.top p{color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:13px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:34px;height:20px;flex:none}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px;padding:14px 24px 60px;
  max-width:1500px;margin:0 auto;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;min-width:0}
.card.differ{border-left:5px solid var(--differ)}
.card.unsure{border-left:5px solid var(--unsure)}
.card h2{font-size:16px;line-height:1.3;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px;font-size:12px}
.tags span{border:1px solid var(--line);border-radius:99px;padding:0 9px;color:var(--muted)}
.tags code{margin-left:auto;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.card svg{display:block;width:100%;height:auto}
.note{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13px}

/* the picture */
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
svg .t{font-size:13px;font-weight:600}
svg .d{font-size:11.5px;fill:var(--muted)}
svg .r{font-size:11px;font-style:italic;fill:var(--muted)}
svg .kind,svg .sslabel{font-size:10px;font-weight:700;letter-spacing:.06em;fill:var(--muted)}
svg .sslabel{fill:var(--ss)}
svg .id{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--link);text-decoration:underline}
svg .box{fill:var(--in-bg);stroke:var(--in);stroke-width:1.6}
svg .box.paper{fill:var(--surface);stroke:var(--ink)}
svg .out .box,svg .box.nopaper{fill:var(--surface);stroke:var(--out);stroke-width:1.3;stroke-dasharray:5 4}
svg .out .t{fill:var(--muted);font-weight:500}
svg .rest{fill:var(--surface)}
svg .share{fill:var(--in-bg)}
svg .cut{stroke:var(--in);stroke-width:1.3;stroke-dasharray:3 3}
svg .box.edge{fill:none}
svg .link{fill:none;stroke:var(--in);stroke-width:1.8}
svg .link.out,svg .link.none{stroke:var(--out);stroke-width:1.3;stroke-dasharray:5 4}
svg .ss{fill:none;stroke:var(--ss);stroke-width:1.5}
svg .mark circle{fill:var(--differ)}
svg .mark text{fill:#fff;font-size:12px;font-weight:700}

@media (max-width:600px){.gallery{grid-template-columns:1fr;padding-inline:12px}.top{padding-inline:12px}}
</style>
</head>
<body>
{{NOTICE}}
<header class="top">
  <h1>{{TITLE}}</h1>
  <p>One picture per study: its paper on the left, its GEO datasets on the right. {{COUNT}}.</p>
  <div class="legend">
    <span><svg viewBox="0 0 34 20"><rect class="box" x="1" y="2" width="32" height="16" rx="4"/></svg>dataset in the study</span>
    <span><svg viewBox="0 0 34 20"><g class="out"><rect class="box" x="1" y="2" width="32" height="16" rx="4"/></g></svg>linked, but left out</span>
    <span><svg viewBox="0 0 34 20"><rect class="share" x="1" y="2" width="16" height="16"/><rect class="box edge" x="1" y="2" width="32" height="16" rx="4"/></svg>only part of the dataset belongs</span>
    <span><svg viewBox="0 0 34 20"><rect class="ss" x="1" y="1" width="32" height="18" rx="5"/><rect class="box" x="6" y="6" width="22" height="8" rx="2"/></svg>outline: a SuperSeries</span>
    <span><svg viewBox="0 0 34 20"><rect class="box paper" x="1" y="2" width="32" height="16" rx="4"/></svg>paper</span>
    <span><svg viewBox="0 0 34 20"><g class="mark"><circle cx="17" cy="10" r="9"/><text x="17" y="14" text-anchor="middle">?</text></g></svg>the two models disagreed about this one</span>
  </div>
</header>
<main class="gallery">
{{CARDS}}
</main>
<script>
/* Only so a screenshot can force a theme: example.html?theme=dark */
var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t;
</script>
</body>
</html>
