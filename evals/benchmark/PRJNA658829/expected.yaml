# REVIEWED 2026-07-31 against the publication — no longer an auto-seeded transcript.
#
# experiment.* are transcribed from the archive's own BioSample/SRA records (records.json beside
# this file); every value below was confirmed against Ben-David, Boocock, Guo, Zdraljevic, Bloom &
# Kruglyak, eLife 2021;10:e65857, DOI 10.7554/eLife.65857 (PMID 33734084) — whose Data availability
# section names this BioProject under exactly the study title kept below.
# Pruned in review, because a submitter re-typing them would move them without the science moving:
#   - study.center: "UCLA" abbreviates an affiliation, and says nothing about the data.
#   - samples.*.tissue: "whole-organism" answers the BioSample package's mandatory tissue field for
#     an animal nobody dissected; "whole organism" or "whole animal" would be as true.
#   - samples.*.sex: the paper never states the sequenced pool's sex. fog-2(q71)/fog-2(kah89) force
#     outcrossing, so both sexes are there, but "mixed" is the archive's wording for "unsorted".
# library.chemistry (+ equivalence_members) is the regression baseline resolved from the
# fingerprint's pinned bytes at the `predicts` versions; the paper states "Chromium Single Cell 3'
# v3" (10x Genomics CG000201), which agrees with the resolved 10x-3p-gex-v3. A code change that
# moves it turns this case red.
outcome: decide
description: >-
  Benchmark: PRJNA658829 (Ben-David 2021, one-pot C. elegans eQTL scRNA-seq) resolved from its
  fingerprint package. It pins two things: the chemistry seqforge reads out of the pinned bytes, and
  the archive join — the F4 mapping population (SAMN15970313) and the pooled-parents control
  (SAMN15970314) must stay two samples, each keeping its own strain string. Red here means resolve
  moved off 10x-3p-gex-v3, or a sample was dropped, merged, or joined to the wrong record.
predicts:
  seqforge: 2026.7.1
  kb: 2026.7.6
  workflow: 2026.7.13
fields:
  library.chemistry: 10x-3p-gex-v3
  library.equivalence_members:
  - 10x-3p-gex-v3.1
  experiment.organism: 6239
  experiment.study.title: Whole-organism mapping of the genetics of gene expression at cellular resolution
  # The two strain strings are NOT two spellings of one cross, and must not be tidied into each
  # other:
  #   QX2314xPTM299_F4 (SAMN15970313) is the F4 segregant pool — "192,000 F4 were seeded", 5 lanes;
  #   QX2314+PTM299 (SAMN15970314) is the parental control — QX2314 and PTM299 "seeded together in
  #   equal numbers ... processed together from that point onwards", one lane, aliased "Parental".
  # `+` is the submitter's pooled-parents notation and `x` the cross; graded verbatim vs records.
  experiment.samples.*.strain:
  - QX2314+PTM299
  - QX2314xPTM299_F4
  experiment.samples.*.dev_stage:
  - L2
  - L2
  experiment.samples.SAMN15970313.strain: QX2314xPTM299_F4
