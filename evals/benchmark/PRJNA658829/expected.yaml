# REVIEWED 2026-07-31 against the publication — no longer an auto-seeded transcript.
#
# experiment.* are transcribed from the archive's own BioSample/SRA records (records.json beside
# this file); every value below was confirmed against Ben-David, Boocock, Guo, Zdraljevic, Bloom &
# Kruglyak, eLife 2021;10:e65857, DOI 10.7554/eLife.65857 (PMID 33734084) — whose Data availability
# section names this BioProject under exactly the study title kept below.
# Pruned in review, because a submitter re-typing it would move it without the science moving:
#   - study.center: "UCLA" abbreviates an affiliation, and says nothing about the data.
# library.chemistry (+ equivalence_members) is the regression baseline resolved from the
# fingerprint's pinned bytes at the `predicts` versions; the paper states "Chromium Single Cell 3'
# v3" (10x Genomics CG000201), which agrees with the resolved 10x-3p-gex-v3. A code change that
# moves it turns this case red.
outcome: decide
description: >-
  Benchmark: PRJNA658829 (Ben-David 2021, one-pot C. elegans eQTL scRNA-seq) resolved from its
  fingerprint package. It pins the chemistry seqforge reads out of the pinned bytes, and the organism
  and project title read from the archive records. Red here means resolve moved off 10x-3p-gex-v3,
  or the reading of the records moved.
predicts:
  seqforge: 2026.7.1
  kb: 2026.7.6
  workflow: 2026.7.13
fields:
  library.chemistry: 10x-3p-gex-v3
  library.equivalence_members:
  - 10x-3p-gex-v3.1
  experiment.organism: 6239
  experiment.project.title: Whole-organism mapping of the genetics of gene expression at cellular resolution
# Harvest ground truth, added 2026-08-01, and checked against the text the PACKAGE carries
# (`info/text/Ben-David et al. 2020 - ...txt`) rather than against the published paper — that file is
# the only thing a run can read. Graded only under --llm.
assertions:
  # Written verbatim in the carried text, e.g. "the model nematode Caenorhabditis elegans". Asked of
  # a dataset-scoped document only, so the paper is the sole possible source and nothing collides.
  - field: experiment.organism
    value: Caenorhabditis elegans
