# REVIEWED 2026-07-31 against the publication — no longer an auto-seeded transcript.
#
# experiment.* are transcribed from the archive's own BioSample/SRA records (records.json beside
# this file); every value below was confirmed against Packer, Zhu et al., Science 365:eaax1971
# (2019), doi:10.1126/science.aax1971, PMID 31488706.
# Pruned in review, because a submitter re-typing them would move them without the science moving:
#   - study.center: the project record's center_name is the string "GEO" — plumbing, not a lab.
#   - samples.*.source_name: "C. elegans embryos" re-types organism + dev_stage, both kept.
# library.chemistry (+ equivalence_members) is the regression baseline resolved from the
# fingerprint's pinned bytes at the `predicts` versions; the paper states "Single cell RNA-seq
# libraries were generated with 10X Genomics v2 chemistry and standard protocols, and sequenced on
# Illumina NextSeq instruments", which agrees with the resolved 10x-3p-gex-v2. A code change that
# moves it turns this case red.
#
# The transcript beside this file declares SEVEN samples, not the archive's eight. The eighth
# (SAMN14126930 / SRX7740729) carried 910 of the series' 966 run records, and a run record with
# prose is one extraction call — so it was 92% of this case's LLM spend and 83% of the whole
# benchmark's, for a sample no slice in the package can join to and no expectation below grades.
# `materialize` now narrows a fingerprint case's records to what its slices reach, so the transcript
# cannot drift back: re-fetching the full accession and committing it lands here at seven again.
#
# Measured cost, deepseek-v4-pro, before -> after (the drop above, then collapsing each sample's run
# aliases into one document): 983 -> 22 calls, 3,141,899 -> 86,220 input tokens, 300.6s -> 131.7s.
# The 500,000-token ceiling this run carried was never approached, which is what a ceiling is for.
#
# SETTLED 2026-08-01 (#160): the outcome moves from `decide` to `ask`, and the question is one a
# human must answer. Nothing about the chemistry claim moved with it.
#
# It graded `over_ask` from 2026-07-31, and the suspected cause — this series' own over-sequenced
# SRX5411291 — was wrong. The resolver names the pair it stops on: "Reads are byte-consistent with
# multiple processing-divergent chemistries (10x-3p-gex-v2, 10x-5p-gex-v2)". The 5' v1/v2 entry
# landed in the KB that same day, and it is byte-identical to 3' v2 by construction — 26 bp R1
# (16 CB + 10 UMI), open-ended cDNA mate, and the SAME 737K-august-2016 whitelist, so every
# structural rung ties and rung 3 consults one file for both. The KB says so itself
# (`distinguishable_by: [metadata, alignment]`); the one param that differs is soloStrand, which no
# probe observes, and a published both-ways run measured 0.5-0.6 gene-expression correlation under
# the wrong orientation against >0.98 under the right one. So the ask is the honest answer and
# `decide` had been correct only while the alternative had no entry — the same sentence
# `evals/cases/spec/10x-v2-bytes-only` already carries for synthetic 26 bp reads. This case is the
# real-data instance of it.
#
# NEITHER MECHANISM THE LADDER OFFERS IS AVAILABLE HERE, which is why the answer is a human's.
# Alignment is rung 6 and unbuilt. Metadata is rung 0 and this dataset has none to give: the
# archive records never write 3' or 5' — every experiment record is a GSM title plus
# `library_strategy: RNA-Seq` — and the carried paper says "10X Genomics v2 chemistry" once and
# never names the end. A recipe `hypothesis:` is therefore not available either; it stands in for a
# chemistry the record states verbatim, and no record here states this one. What the corpus knows is
# what is pinned below: the library lands on 10x-3p-gex-v2, and it asks between exactly two leaves.
#
# The chemistry field claim is UNCHANGED and is still graded — `fields` is checked on `ask` as well,
# because the library takes a value while the question rides alongside — so the paper's own
# "10X Genomics v2 chemistry" remains the assertion this case has always made.
outcome: ask
conflict:
  # A Question, not a Conflict: nothing disagrees, the bytes tie. `options` is what `positions` is
  # for that shape, and it is the load-bearing half — the field name alone would be satisfied by any
  # chemistry question at all, including one about a pair these reads are nowhere near.
  field: library.chemistry
  options:
  - 10x-3p-gex-v2
  - 10x-5p-gex-v2
description: >-
  Benchmark: GSE126954 (Packer et al., Science 2019) resolved from its fingerprint package. It pins
  two things at once. First, that resolve still reads 10x-3p-gex-v2 out of the pinned bytes — the
  chemistry the paper names. Second, that the BioSample join still lands each of the seven 10x
  embryo samples on its own attributes: the four UW collections are VC2010 (a fully sequenced N2
  derivative, used because it survives two bleach-synchronisation cycles) and the three UPenn
  mixed-embryo collections are N2, a real lab-level split stated in both the paper's methods and
  each sample's growth protocol — so a shuffled join surfaces as a wrong strain instead of passing
  on the `*` list alone. The series' eighth sample (GSM4318946 / SAMN14126930) is the L2-stage
  sci-RNA-seq re-analysis of Cao et al. 2017 and is in neither the package nor `records.json`; were
  it ever added, these lists would grow an eighth entry and a dev_stage of L2. Breaking this case
  means the chemistry decision or the record join moved.
predicts:
  seqforge: 2026.7.1
  kb: 2026.7.6
  workflow: 2026.7.13
fields:
  library.chemistry: 10x-3p-gex-v2
  experiment.organism: 6239
  experiment.study.title: A lineage-resolved molecular atlas of C. elegans embryogenesis at
    single cell resolution
  experiment.samples.*.strain:
  - N2
  - N2
  - N2
  - VC2010, derived from N2
  - VC2010, derived from N2
  - VC2010, derived from N2
  - VC2010, derived from N2
  experiment.samples.*.dev_stage:
  - embryo
  - embryo
  - embryo
  - embryo
  - embryo
  - embryo
  - embryo
  experiment.samples.SAMN10988833.strain: VC2010, derived from N2
  experiment.samples.SAMN10988844.strain: N2
