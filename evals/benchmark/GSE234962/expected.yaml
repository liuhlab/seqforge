# REVIEWED 2026-07-31 against the publication — no longer an auto-seeded transcript.
#
# experiment.* are transcribed from the archive's own BioSample/SRA records (records.json beside
# this file); every value below was confirmed against Smith, Taylor, Blum, Gitler, Miller &
# Kratsios, Cell Reports 43(3):113857 (2024), doi:10.1016/j.celrep.2024.113857, PMID 38421866.
# Pruned in review, because a submitter re-typing them would move them without the science moving:
#   - study.center: "Cell and Developmental Biology, Vanderbilt University" is the submitting lab's
#     department, not a sequencing center; nothing in the paper turns on it.
#   - samples.*.source_name: a verbatim duplicate of samples.*.tissue, so it is a second copy of
#     one claim rather than a second claim.
#   - samples.*.genotype ("wt"): contradicts the strain it sits beside — both strains carry an
#     integrated transgene, and the paper never calls these animals wild type.
# library.chemistry (+ equivalence_members) is the regression baseline resolved from the
# fingerprint's pinned bytes at the `predicts` versions; the paper states "single cell 3' RNA
# sequencing utilizing the 10X Chromium system, v3 chemistry", sequenced on a NovaSeq 6000, which
# agrees. A code change that moves it turns this case red.
#
# Kept, with one discrepancy on the record: the archive writes KRA257's transgene as
# "kasIs2 [lin-39p::RFP + pha-1(+)]", while the paper's key resources table writes
# "kasIs2[lin-39_intron1::tagRFP]" (from Feng et al.) — same reporter, submitter shorthand for the
# regulatory element, and pha-1(+) is the Kratsios lab's usual co-injection marker rather than an
# extra allele. The value graded here is the archive's, per the corpus contract; strain stays
# because it is the ONLY attribute that differs between the four samples, so it is what makes the
# per-accession claim below able to catch a shuffled join at all.
#
# SETTLED 2026-08-01 (#160): the `--llm` grade that moved is EXPLAINED, and the explanation is that
# nothing moved it. This case decides byte-only and is NONDETERMINISTIC under --llm; the mechanism is
# exact and reproduces with no model at all; and neither code change suspected of having fixed it
# can have. `outcome` stays `decide`, which is the argued half — see the last paragraph.
#
# WHAT STOPS IT. `library.chemistry` is asked of every experiment document, and this series'
# experiment documents are one GSM title — "GSM7486859: lin-39p::RFP wt MNs rep 1; Caenorhabditis
# elegans; RNA-Seq" — plus two aliases. A draft of `library.chemistry = "RNA-Seq"` off that
# span-verifies and entails BY CONSTRUCTION, because the value IS the quote: entailment is vacuous
# wherever the value is a substring of its own quote, which is the limit the verifier documents about
# itself. "RNA-Seq" is not a chemistry — it is SRA's library_strategy, true of every 10x deposit ever
# made — but an asserted chemistry is matched against KB ids and aliases by substring, and "rna-seq"
# sits inside bulk-rnaseq's "bulk RNA-seq". So it reaches the byte resolver as a BULK claim
# against barcoded observed bytes and surfaces `conflict-bulk-asserted-single-cell-observed` on
# library.chemistry: exit 4, graded `over_ask`. Handing that one string to the resolver as a
# hypothesis over this case's own pinned bytes reproduces it exactly with no LLM in the loop, while
# "10x Chromium v3 chemistry" and "single cell 3' RNA sequencing" both give exit 0.
#
# AND NOTHING OVERRIDES IT. The accepted claims are a last-wins map over the documents in plan order,
# and the four experiment documents come after both carried texts — so one line of GSM title
# overwrites the good `10x-3p-gex-v3` read off mmc2.txt, the supplementary table that names the kit
# version per sample. The paper's own correct claim never reaches that map at all: its quote is
# "single cell 30 RNA sequencing utilizing the 10X Chromium system, v3 chemistry" — the extracted
# text renders 3' as 30 — and it is refused `not_entailed`, which is the tripwire working.
#
# WHAT DID NOT MOVE IT, checked rather than assumed. The run-alias collapse (#178) is a NO-OP here:
# four samples with one run each, so every group is a group of one and the collapsed document IS that
# run's own document. `seqforge eval plan --case GSE234962` reports `n_records_collapsed: 0`, and the
# twelve record documents are byte-identical, in identical order, before and after it. The metadata
# resolver's one-source rule (#183) is ruled out by construction rather than by measurement: it
# changes which sample-attribute values survive, and a case's outcome class is read from the BYTE
# resolver's exit code, which that resolver never reaches. So the earlier `over_ask` and the later
# `correct` are two draws from one stochastic stage, not two code states.
#
# THE EXPECTATION STAYS AT `decide`. Unlike GSE126954's, this question is one code should settle: the
# bytes are decisive, and what stops the run is a library_strategy re-read out of the same record
# that typed it — the shape #183 fixed one field over, for sample attributes, and which did not
# generalise to the chemistry hypothesis. Moving `outcome` to `ask` would enshrine a manufactured
# conflict as the specification, so it stays and this case reads `over_ask` whenever the claim
# appears. Filed as #184, with the candidate fixes and the one already rejected.
#
# HOW OFTEN, measured rather than inferred — six single-trial --llm runs of this case on
# deepseek-v4-pro, 2026-08-01. Four completed and graded: TWO `over_ask` and TWO `correct`, which is
# the instability stated as a number rather than as a suspicion, and which is why one green run
# settles nothing here. The `RNA-Seq` claim appeared in 3 of the 6 passes over the four experiment
# documents, and in THREE DIFFERENT records (SRX20684355, SRX20684354, SRX20684353) — so it is a
# property of the document shape, which all four share, and not of one record. The other two runs
# aborted on DeepSeek's known invalid-JSON failure, both on mmc2.txt, and skipped. Every one of the
# six refused the paper's own `10x-3p-gex-v3` draft. EXPECT THIS CASE TO FLIP under --llm until #184
# is settled; it is stable and green byte-only, which is what the per-release job runs.
#
# The graded assertion below is a measurement too, and it moved: `experiment.organism` matched in 3
# of the 4 graded runs and was refused `span_not_found` in the fourth. The claim is not in doubt —
# the carried text writes the binomial 15 times — so what that fourth run recorded is the extraction
# stage's recall, which is the thing an `assertions:` block exists to measure rather than to assume.
outcome: decide
description: >-
  Benchmark: GSE234962 (Smith et al. 2024, Cell Rep) pins two independent things — that resolve
  still reads 10x-3p-gex-v3 out of this dataset's pinned bytes, and that the record join still
  lands each of the four FACS-sorted motor-neuron libraries on its own strain, young-adult stage
  and tissue. A red here means either the chemistry resolver moved or the sample-to-record join
  shuffled.
predicts:
  seqforge: 2026.7.1
  kb: 2026.7.6
  workflow: 2026.7.13
fields:
  library.chemistry: 10x-3p-gex-v3
  library.equivalence_members:
  - 10x-3p-gex-v3.1
  experiment.organism: 6239
  experiment.study.title: A molecular atlas of adult C. elegans motor neurons reveals ancient diversity
    delineated by conserved transcription factor codes
  experiment.samples.*.strain:
  - CZ631 juIs14 [ acr-2::GFP + lin-15(+)]
  - CZ631 juIs14 [ acr-2::GFP + lin-15(+)]
  - KRA257 kasIs2 [lin-39p::RFP + pha-1(+)]
  - KRA257 kasIs2 [lin-39p::RFP + pha-1(+)]
  experiment.samples.*.tissue:
  - Motor neurons
  - Motor neurons
  - Motor neurons
  - Motor neurons
  experiment.samples.*.age:
  - young adult
  - young adult
  - young adult
  - young adult
  experiment.samples.SAMN35739865.strain: KRA257 kasIs2 [lin-39p::RFP + pha-1(+)]
# Harvest ground truth, added 2026-08-01, and checked against the text the PACKAGE carries — the
# extracted `info/text` beside the reads, not the published article — because that file is the only
# thing a run can read. Graded only under --llm.
assertions:
  # Written verbatim 15 times in the carried text, opening with "we generate a comprehensive
  # molecular atlas of adult Caenorhabditis elegans MNs". `experiment.organism` is asked of a
  # dataset-scoped document and of nothing else, so the carried paper is its only possible source and
  # no archive record can collide with it.
  - field: experiment.organism
    value: Caenorhabditis elegans
forbidden_fields:
  # The bait is real and it is TYPED, which is what makes it this case's own. The carried text says
  # "embryos obtained by hypochlorite treatment of adult hermaphrodites" — bleach synchronisation,
  # husbandry rather than an experimental variable — and every BioSample beside it carries
  # "synchronization protocol: L1 arrest" in a field of its own. `treatment` is asked of all four
  # experiment documents, whose whole text is a GSM title, so a quote landing here would be a real
  # sentence attached to the wrong sample and no byte could contradict it. This study has no
  # treatment: the variable is the reporter strain.
  - experiment.samples.treatment
  # "disease" occurs four times in the carried text and never about a worm — "an ancient cell type
  # targeted by multiple adult-onset diseases", ALS, and hindbrain/spinal-cord susceptibility. It is
  # the paper's motivation, not a property of the animals that were sequenced.
  - experiment.samples.disease
