# Real benchmark dataset, run from its byte-light fingerprint package on the public HF repo.
# Pulled anonymously (pooch-cached, no token) only by the opt-in benchmark job; unreachable => skip,
# and a 404 => absent, which the report names as a gap in the corpus rather than as a network blip.
# Publish the package with: seqforge io publish-package <the .fingerprint.tar.gz>
#
# Published on whatever colour it grades — see expected.yaml. It was committed as a prediction of a
# fix while it still failed, and now grades correct; it was never withheld to keep the tier green.
#
# SRR6750041, the cheapest run at ~77.6 M reads. The transcript beside this file is narrowed to that
# one run, because a record no slice can join to costs an extraction call and grades nothing.
# Rebuild with: seqforge preflight --accession SRR6750041 -n 20000 -C <dir>  (~60 s, ~10 MB).
generate:
  kind: fingerprint
  hf: packages/GSE110823.fingerprint.tar.gz
