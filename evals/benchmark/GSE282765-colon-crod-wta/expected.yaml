description: >-
  GSE282765 / GSM9270243 (`Colon_Crod_Mm_WTA`, SRX30721098, SRR35669366) — mouse colon CD45+ cells
  after Citrobacter rodentium infection, BD Rhapsody WTA on ENHANCED capture beads. The benchmark's
  first REAL BD Rhapsody Enhanced dataset: until now the 0-3 bp diversity insert, the GTGA/GACA
  linkers and the anchored per-read frame recovery were proven only on reads seqforge generated from
  its own spec, which is the same circularity that hid a defect in `splitseq`.

  Its edge against GSE274290 is the point. Both samples' extract protocols name the "BD Rhapsody
  Express Single-Cell Analysis System"; GSE274290 is the original fixed-offset bead and this one
  declares `enhanced beads`. Express is the instrument, Enhanced is the bead, and only the R1 bytes
  tell them apart — so this pair fails loudly if the KB ever starts deciding BD chemistry from
  anything but the bead oligo.

  Breaking it would mean one of: the anchored linker frame no longer phase-locks on real reads (as
  against synthetic ones), or the 384x3 Enhanced pools no longer separate from the disjoint 97x3
  pools at rung 3, or the archive transcriber stopped carrying this BioSample's strain/tissue/
  treatment. PRE-REGISTERED before any run — see the header for the evidence chain and for why the
  leaf is predicted `-v2` rather than `-v1`.
