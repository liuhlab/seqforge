outcome: decide
description: >-
  RECORD-LESS AND MULTI-LANE — the one shape neither eval tier held, and the one #263 compiled wrong.
  Two libraries, two lanes each, eight files, no `records.json`: it must resolve to TWO samples.

  WHAT #263 WAS. `run_key` stripped the mate token and kept the lane, so `x_S1_L001_R1_001` and
  `x_S1_L002_R1_001` keyed to two different runs — and with no archive record the run grouping IS the
  sample identity (ADR-0010, "no archive is the normal case"). A four-lane library therefore compiled
  as four samples at a quarter depth each, four `<sample>.h5ad`, self-consistent, every file assigned
  a role, `validate` clean, exit 0. Nothing refused, which is the point: it is the failure class
  `resolve/group.py` was written to prevent, one level up. ADR-0027 makes a run lane-blind.

  WHY NEITHER TIER COULD SEE IT, because that is what this case is filling and it should not have to
  be rediscovered. Every ci case that runs hermetically is record-less — `real/PRJNA1027859` is the
  only one carrying a `records.json` and it skips without its out-of-git root — but until #286 every
  one of them was a single library deposited under a single run, because a `spec` recipe had no
  deposit knob and enforced one run per case. The benchmark tier has all 250 of the corpus's real lane
  tokens — eight cases carry one and four of those (GSE126954, GSE229022, GSE256266, GSE310378) hold a
  run spanning two lanes or more — and every one of the eight ships a committed `records.json`, so the
  join lands at the SAMPLE level, above the run, and the filename path never runs at all. The corpus
  hole was the exact shape of the bug.

  BOTH FAILURE DIRECTIONS, which is why it is two libraries and not one. Four samples is the split
  #263 shipped; one sample is the merge ADR-0027 forbids — `_S<n>` is the sample-sheet entry and the
  only token separating two libraries on one flowcell, so a key that stripped it would fuse
  `SIM_b01_S1` and `SIM_b02_S2` into a single plausible matrix nobody would notice. The asymmetry is
  the reason a grouping rule may fail toward the first and never toward the second, and a case that
  pinned only the split would leave the expensive direction unguarded. `experiment.n_samples: 2`
  refuses both: it is 4 under #263 and 1 under the merge.

  A COUNT AND NOT A LIST OF SAMPLE IDS, deliberately. The ids are `run_key`'s own output, so pinning
  them here would pin the naming convention this case happens to deposit under alongside the claim
  the case is actually making. The ids, the four-files-per-sample depth and the roles every one of the
  eight files must still carry are asserted in
  `tests/test_evals.py::test_a_record_less_multi_lane_deposit_stays_two_samples`, over the same pass
  the harness grades — because a sample holding a lane twice, or eight files collapsing to four, would
  leave the count below intact and the depth wrong.

  `library.chemistry` is here anyway and is not decoration: it is what makes the run a decision rather
  than a refusal, so a grouping claim is being made about a dataset the compiler actually compiled.
fields:
  library.chemistry: bulk-rnaseq
  experiment.n_samples: 2
