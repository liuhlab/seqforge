# Two libraries on one flowcell, two lanes each, and NO archive record — the deposit shape #263
# compiled as four samples. `deposit:` writes the files the way bcl2fastq names them,
# `SIM_b<NN>_S<n>_L<lane>_<read>_001.fastq.gz`, after GSE126954's `Murray_b01_S1_L001_R1_001.fastq.gz`
# (14 libraries x 4 lanes); the two libraries carry different `_S<n>`, because that token is the
# sample-sheet entry and is the one thing separating them (ADR-0027).
#
# THIS CASE USED TO BE STAGED FROM `tests/`, and it is worth saying why it no longer is. A `spec`
# recipe deposited ONE library under ONE run and enforced it, so four lanes of two libraries could not
# be written here at all: the layout lived in `tests/test_evals.py`, which built it by hand, pointed
# an environment variable at the directory, and ran this case through `run_case` — so the corpus pass
# SKIPPED it and only that one test ever exercised it. `SpecRecipe.deposit` (#286) is the knob it was
# waiting for. The case now runs hermetically on every commit like any other, and grouping is
# GRADEABLE (`experiment.n_samples`, below) rather than merely assertable.
#
# WHY BULK, and it is the same argument `_two_bulk_runs` makes in `tests/test_evals.py`: a barcoded
# spec's synthetic barcodes are drawn from pools this case would have to register itself, and every
# real whitelist misses them — which would turn a grouping case into a question about its own
# fixture's onlist. Bulk needs no whitelist. The bug is in the filename path and is chemistry-blind,
# so the cheapest chemistry that decides from bytes alone is the right one.
#
# `n` IS PER FILE, so 400 here is 3200 reads written across eight files — four times what a one-library
# case writes. It is low on purpose and costs this case nothing: bulk is decided by the distinct-ratio
# of two cDNA mates, a support 400 reads settle exactly as `spec/bulk-pe-bytes-only`'s 3000 do, and
# the subject here is the filenames.
generate:
  kind: spec
  spec: bulk-rnaseq
  n: 400
  seed: 0
  onlists: none
  deposit:
    libraries: 2
    lanes: 2

# No `hypothesis:`. Nothing here is steered — the bytes name the chemistry and the FILENAMES name
# the samples, and the filenames are the whole subject.
