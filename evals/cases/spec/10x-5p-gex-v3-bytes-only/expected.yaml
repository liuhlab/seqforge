outcome: decide
description: >-
  GEM-X 5' v3 from bytes alone, and the case that pins the difference between the two 5' entries. Its
  geometry is byte-identical to FOUR other entries — 3' v3, 3' v3.1, GEM-X 3' v4 and Multiome GEX — so
  chemistry cannot be settled structurally. Unlike its 26 bp sibling it has its own whitelist, and the
  separation is measured rather than assumed: 3M-5pgex-jan-2023 shares 0.62% with 3M-february-2018,
  6.87% with 3M-3pgex-may-2023 and 0.00% with 737K-arc-v1, all far under the 0.6 gate every hit-rate
  test uses. So this case decides at rung 3 where `10x-v2-bytes-only` correctly asks, which is why "5'
  is only decidable by metadata" is a claim about a version PAIRING and not about 5'.

  It is the positive target the retargeted 3' edges now resolve to: v3 and v3.1 used to declare a
  confusable against the bare id `10x-5p-gex`, which no resolver could ever score. The role assertions
  pin WHICH file the resolver called the barcode read, from structure, with no filename semantics.
fields:
  library.chemistry: 10x-5p-gex-v3
  library.roles.R1: R1
  library.roles.R2: R2
