outcome: decide
description: >-
  GEM-X 3' v4 from bytes alone. Geometry is byte-identical to 3' v3 and v3.1 (16 CB + 12 UMI, cDNA R2),
  so chemistry cannot be settled structurally — only the whitelist tells v4 from its predecessors, and
  this case proves the GEM-X list (3M-3pgex-may-2023) is what the resolver settles on rather than
  mis-calling it v3 or abstaining. Both v3 and v3.1 named this id as a confusable with no spec to
  resolve to, so a real GEM-X library had a whitelist to miss and no positive target to hit. The role
  assertions pin WHICH file the resolver called the barcode read, from structure, with no filename
  semantics.
fields:
  library.chemistry: 10x-gemx-3p-v4
  library.roles.R1: R1
  library.roles.R2: R2
