# PROVISIONAL. The candidate studies for the standard set, picked 2026-11-19.
# Identifiers and the picker's own short words only; no record text is copied here.
# Counts (n_samples, n_experiments) and linked_series are the whole linked group, read from the
# pool measured on the store build below. Direction, shape and design were judged by reading each
# Series' public GEO record and its paper's PubMed abstract on the picking date.
# hard_shape: recites_older_series | paper_over_several_series | superseries |
#             series_with_two_studies | series_without_paper | null (the plain case).
# compiles_today: the knowledge-base spec the record's protocol text points to (no read was probed),
#   a list when the study has two compiling chemistries, or null. `10x-3p-gex` without a version
#   means the record names the kit family and the version was not read.
# linked_series: every Series of the linked group, the picked one included; pmids: every paper
#   linked to any of them in the store build.

