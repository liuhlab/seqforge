# The study reading of GSE112068: IMR-90 fibroblasts after a 2 h bleomycin exposure, three doses
# crossed with eleven harvest times. No paper is linked, so every quote is from a GEO record.
#
# A claim is one label of one sample, on one line: what it says, how it is backed, how sure.
#   what:   text (the source's own words), plus term (an ontology id) only on a clear match;
#           age, dose, duration and time_point add value and unit; a claim on a factor's label
#           adds level, one of that factor's level names; biosample and donor carry an id minted here.
#   backed: exactly one of
#             quoted: [passage numbers]     the passages below say it
#             inferred: "how"               no passage says it outright; see: [numbers] it rests on
#             unknown: "note"               the study does not say
#             na: "why"                     the label does not apply to this sample
#   against: [passage numbers], optional beside any mark: the passages that say otherwise
#   p:      the writing model's own estimate that the claim as written is right, given what `read`
#           lists. On unknown it is the chance that the material read really does not say.
format: 2
study: GSE112068
models: {reading: claude-fable-5-2, probabilities: claude-fable-5-2}
read: [records]

# Where the ontology ids below came from. Every id but the Cellosaurus one was looked up at the
# EBI's OLS4 on this date, when the assay id was added. OLS4 does not hold Cellosaurus.
ontology_snapshot: {source: "EBI OLS4 web search; CVCL_0347 is from the writing model's memory, not looked up", date: 2026-11-21}

