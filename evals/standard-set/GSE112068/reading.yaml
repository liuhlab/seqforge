# A factor names the label the study varied on purpose. `levels` is in the factor's own order.
# The two factors are crossed, and the cross is not full: 2ug and 40ug each have the ten times
# from 2h to 8d; 0ug has only 0d, 4d and 8d. No cell of the cross has a second library.
# time_point is a study-specific attribute: the time from the exposure to the RNA harvest.
# It is not `duration`, which holds the length of the exposure itself.
factors:
  dose:       {levels: [0ug, 2ug, 40ug], baseline: 0ug, ordered: true, quoted: [1, 12, 3], p: 0.97}
  time_point: {levels: [0d, 2h, 4h, 8h, 12h, 24h, 36h, 2d, 4d, 6d, 8d], baseline: 0d, ordered: true, quoted: [2, 13, 14], p: 0.85}

# Inheritance, the whole rule: a sample has every claim under `shared`, except a label its own
# row writes, and that claim replaces the shared one whole. Here `treatment` and `duration` hold
# for the twenty exposed samples, and the three unexposed rows replace them.
shared:
  donor:             {id: D1, inferred: "one named cell line with one donor age, so one fetus", see: [6, 8], p: 0.95}
  assay:             {text: RNA-Seq, term: "EFO:0008896", quoted: [9, 10], p: 0.99}
  target:            {na: "RNA-seq of polyA RNA has no target", p: 0.99}
  control_type:      {na: "no library is a background control; the 0 ug/ml samples are the dose factor's baseline", p: 0.97}
