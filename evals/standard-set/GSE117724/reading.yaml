# A factor names the label the study varied on purpose. Genotype was varied only among the 18
# RNA-seq samples; the two ChIP-seq samples share one transgenic genotype that is not a level.
factors:
  treatment: {levels: [DMSO, R24], baseline: DMSO, ordered: false, quoted: [4, 1, 2], p: 0.98}
  genotype:  {levels: [wild-type, tm2590, ums12], baseline: wild-type, ordered: false, quoted: [4, 1], p: 0.95}

# Inheritance, the whole rule: a sample has every claim under `shared`, except a label its own
# row writes, and that claim replaces the shared one whole. Where the two assays differ, `shared`
# holds the RNA-seq value and the two ChIP-seq rows replace it.
shared:
  donor:             {na: "each library is a pool of many whole worms of one strain; there is no single animal", p: 0.9}
  assay:             {text: RNA-Seq, term: "EFO:0008896", quoted: [21, 22, 8, 3], p: 0.99}
  target:            {na: "RNA-seq of polyA-selected mRNA has no target", p: 0.99}
  control_type:      {na: "RNA-seq; no library is a background control, and the DMSO groups are the treatment baseline", p: 0.98}
  species:           {text: Caenorhabditis elegans, term: "NCBITaxon:6239", quoted: [14], p: 0.99}
  sex:               {text: hermaphrodite, term: hermaphrodite, quoted: [6, 9], p: 0.95}
  age:               {unknown: "records and paper give a stage, not an age in hours or days", p: 0.9}
  development_stage: {text: L4, term: "WBls:0000038", quoted: [15, 17], p: 0.6}
  tissue:            {text: Whole animal, term: "WBbt:0007833", quoted: [16], p: 0.98}
  cell_type:         {na: "whole animals, not dissected or sorted", p: 0.97}
  cell_line:         {na: "live animals, not cultured cells", p: 0.99}
  disease:           {text: healthy, term: "PATO:0000461", inferred: "no passage names an infection or a disease state for the sequenced animals; the compound and the mutations are held under treatment and genotype", p: 0.8}
  duration:          {text: overnight, quoted: [18, 6], p: 0.95}

