# Study reading of GSE117724, a SuperSeries: RNA-seq (GSE117700) and ChIP-seq (GSE117719) of whole
# C. elegans exposed to the immune-stimulating compound R24 or its solvent DMSO.
#
# A claim is one label of one sample, on one line: what it says, how it is backed, how sure.
#   what:   text (the source's own words), plus term (an ontology id) only on a clear match;
#           dose and duration add value and unit; a biosample carries an id minted here.
#   backed: exactly one of quoted: [passage numbers], inferred: "how" (see: [passages] it rests on),
#           unknown: "note" (the material read does not say), na: "why" (the label does not apply).
#   against: [passage numbers], optional beside any mark: the passages that say otherwise.
#   p:      the writing model's own estimate that the claim as written is right, given `read`.
#           On unknown it is the chance that the material read really does not say. Not calibrated.
format: 2
study: GSE117724
models: {reading: claude-fable-5-2, probabilities: claude-fable-5-2}
read: [records, abstract, full_text]

# Where the ontology ids below came from. Every id was looked up at the EBI's OLS4 on this date,
# when the assay ids were added.
ontology_snapshot: {source: "EBI OLS4 web search", date: 2026-11-21}

# Each quote is one unbroken span copied from one field, always on one line.
# record: each_sample means all 20 sample records hold this quote in that field.
# A paper quote is a span of the article text with its markup (italics, links) removed.
passages:
  1: {record: GSE117700, field: Series_overall_design, quote: "Transcriptional profiles of C. elegans animals treated with immunostimulator molecule R24 in wild-type and nhr-86 loss of function animals"}
  2: {record: GSE117719, field: Series_overall_design, quote: "DNA binding profile of NHR-86 in C. elegans animals treated with immunostimulator molecule R24 in NHR-86::GFP transgenic animals"}
  3: {paper: "pmid:30668573", section: abstract, quote: "Using genetic epistasis experiments, transcriptome profiling analyses and chromatin immunoprecipitation-sequencing, we show that, in the presence of an immunostimulatory small molecule, NHR-86 binds to the promoters of immune effectors to activate their transcription."}
  4: {paper: "pmid:30668573", section: results, quote: "We compared the mRNA expression profiles of wild-type animals and two different nhr-86 loss-of-function alleles (tm2590 and ums12), each exposed to the immunostimulatory molecule R24 or mock treatment."}
  5: {paper: "pmid:30668573", section: results, quote: "The ChIP-seq experiment was performed with a strain containing a GFP-tagged NHR-86 protein (NHR-86::GFP) that has been previously characterized"}
  6: {paper: "pmid:30668573", section: methods, quote: "Synchronized, L1 stage, hermaphrodites C. elegans of the indicated genotypes were grown to the L4/ young adult stage, transferred to assay plates, and incubated at 20°C overnight."}
  7: {paper: "pmid:30668573", section: methods, quote: "70 μM R24 or solvent control (DMSO, 1% final concentration) assay plates were prepared as described"}
  8: {paper: "pmid:30668573", section: methods, quote: "RNA was isolated using TriReagent (Sigma-Aldrich), purified on a column (Qiagen), and analyzed by mRNA-seq using the BGISEQ-500 platform (BGI Americas Corp)."}
  9: {paper: "pmid:30668573", section: methods, quote: "Briefly, L4 synchronized, hermaphrodite C. elegans (wild-type and transgenic NHR-86::GFP animals) were exposed to “slow killing” plates [41] containing either DMSO (1%) or 70 μM R24 for approximately 18 hours."}
