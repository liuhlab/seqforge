schema_version: 1

# 10x Chromium GEM-X Single Cell 5' Gene Expression v3 — the third-generation 5' kit. Geometry is the
# 28 bp / 16 CB + 12 UMI layout four other entries already occupy (3' v3, 3' v3.1, GEM-X 3' v4,
# Multiome GEX), so nothing structural separates it from any of them. What separates it is its own
# whitelist, and unlike its 26 bp sibling it HAS one: `3M-5pgex-jan-2023` (3 686 400 x 16 bp).
#
# The separation is MEASURED, by set intersection over the packed barcode arrays, not assumed. Fraction
# of the smaller list shared:
#   3M-5pgex-jan-2023 vs 3M-february-2018  (3' v3 / v3.1)   0.62%
#   3M-5pgex-jan-2023 vs 3M-3pgex-may-2023 (GEM-X 3' v4)    6.87%
#   3M-5pgex-jan-2023 vs 737K-arc-v1       (Multiome GEX)   0.00%
# All three are an order of magnitude or more under the 0.6 threshold every hit-rate gate here uses, so
# rung 3 separates this entry from the whole 28 bp cohort decisively rather than marginally. That is
# why this edge is `distinguishable_by: [onlist]` while the 26 bp pair is `[metadata, alignment]`:
# "5' is separable only by metadata or alignment" is a statement about a version PAIRING, not about 5'.

identity:
  id: 10x-5p-gex-v3
  version: "3"
  name: "10x Chromium GEM-X Single Cell 5' Gene Expression v3"
  aliases: ["10x 5' v3", "Chromium 5' v3", "GEM-X 5' v3", "Chromium GEM-X 5'", "SC5Pv3", "SC5P-R2-v3", "GEM-X Single Cell 5'", "single cell 5-prime v3"]
  assay_ontology: ["EFO:0022605"]        # 10x 5' v3 — verified against live EFO (EBI OLS), not memory
  modality: rna

reads:
  # R1 = the technical/barcode read. 28 bp = 16 CB + 12 UMI — the 2 bp longer UMI is what separates v3
  # from the v1/v2 sibling at rungs 0-2. max_len null and over_length_min 100 for the same reason as
  # every other 10x entry: an over-sequenced R1 is a real layout, and the exact-28 gate is what keeps
  # it separable from 26.
  - id: R1
    seqspec_read_id: R1
    file_hint: "_R1_"
    strand: pos
    min_len: 28
    max_len: null
    elements:
      - {type: barcode, name: CB,  start: 0,  end: 16, onlist: cb_whitelist, seqspec_region_type: barcode}
      - {type: umi,     name: UMI, start: 16, end: 28,                       seqspec_region_type: umi}
  # R2 = cDNA (open-ended), 90 recommended cycles for v3 (10x CG000733 p.86). soloStrand Reverse —
  # see the derivation in `backend` below.
  - id: R2
    seqspec_read_id: R2
    file_hint: "_R2_"
    strand: pos
    min_len: 25
    max_len: null
    elements:
      - {type: cdna, name: cdna, start: 0, end: null, seqspec_region_type: cdna}

onlists:
  cb_whitelist:                  # used by backend + the positive supports test
    registry: 3M-5pgex-jan-2023  # GEM-X 5' v3 list — 3,686,400 x 16 bp, forward orientation
    role: cell_barcode
    expected_orientation: forward
  std_v3_probe:                  # probe-only, used ONLY by an exclude anti-gate
    registry: 3M-february-2018   # the 3' v3 / v3.1 list
    role: cell_barcode
    expected_orientation: forward
  gemx_3p_probe:                 # probe-only, used ONLY by an exclude anti-gate
    registry: 3M-3pgex-may-2023  # the GEM-X 3' v4 list
    role: cell_barcode
    expected_orientation: forward
  arc_v1_probe:                  # probe-only, used ONLY by an exclude anti-gate
    registry: 737K-arc-v1        # the Multiome (ARC) GEX list
    role: cell_barcode
    expected_orientation: forward

signature:
  requires:                      # hard structural gates, rungs 0-2 friendly (NO distinct_ratio, NO onlist)
    - {test: read_count, roles: 2}
    # Identical to every other 28 bp entry's gate, by construction: this entry shares every structural
    # rung with the 3' cohort and the whitelist at rung 3 IS the separation, which is what
    # `distinguishable_by: [onlist]` claims below.
    - {test: segment_length, read: R1, length: 28, tolerance: 0, over_length_min: 100}
    - {test: has_segment, read: R1, start: 0,  end: 16, kind: random}
    - {test: has_segment, read: R1, start: 16, end: 28, kind: random}
  supports:                      # additive evidence (rung 3+); weights mirror the 28 bp 3' cohort's
    - when: {test: onlist_hit_rate, read: R1, start: 0, end: 16, onlist: cb_whitelist, orientation: forward, min: 0.6}
      weight: 5.0                # the 5' GEM-X whitelist hitting is the positive signal that this is 5' v3
    - when: {test: distinct_ratio, read: R1, start: 0,  end: 16, expect: low}
      weight: 2.0                # CB recurs -> low distinct ratio
    - when: {test: distinct_ratio, read: R1, start: 16, end: 28, expect: high}
      weight: 1.0                # UMI ~ unique -> high distinct ratio
    - when: {test: distinct_ratio, read: R2, start: 0, end: 20, expect: high}
      weight: 1.0                # cDNA is diverse -> the biological role is scored, not left at 0
    - when: {test: header_index, present: true}
      weight: 0.2
  excludes:                      # one anti-gate per occupant of the 28 bp geometry that is NOT this one
    - {test: onlist_hit_rate, read: R1, start: 0, end: 16, onlist: std_v3_probe,  orientation: forward, min: 0.6}
    - {test: onlist_hit_rate, read: R1, start: 0, end: 16, onlist: gemx_3p_probe, orientation: forward, min: 0.6}
    - {test: onlist_hit_rate, read: R1, start: 0, end: 16, onlist: arc_v1_probe,  orientation: forward, min: 0.6}

backend:
  module: map/starsolo
  params:                        # identical to 3' v3's EXCEPT soloCBwhitelist and soloStrand
    soloType: CB_UMI_Simple
    soloCBstart: 1
    soloCBlen: 16
    soloUMIstart: 17
    soloUMIlen: 12
    soloCBwhitelist: "{onlist:cb_whitelist}"
    # soloStrand Reverse — derived from the kit's own oligos, in full, in the sibling entry
    # `10x-5p-gex-v2/spec.yaml`. In one line: the 5' gel-bead primer ends in the template-switch tail
    # rGrGrG rather than poly(dT) (10x CG000733 p.99), so the barcode is appended to the antisense
    # first strand by template switching at the transcript's 5' end; the barcode-bearing top strand is
    # therefore SENSE, and the Read 2 primer annealing to it emits the complement -> R2 is antisense
    # to the mRNA -> Reverse. The identical derivation on the 3' appendix reproduces `Forward`, which
    # is the known-answer control. `Forward` is correct only for SC5P-PE / SC5P-R1, which this KB
    # cannot express (no `soloBarcodeMate`, no `clip5pNbases` in the starsolo parse namespace).
    soloStrand: Reverse
    soloBarcodeReadLength: 0
    # soloFeatures is NOT here, for the same reason it is absent from every other entry: it says what
    # to COUNT, and counting belongs to the processing manifest where a user may instruct it.

# A child of the 10x-5p-gex family: it shares the 16 bp CB geometry with the v1/v2 sibling and is told
# apart from it by UMI length first and, on an over-length read, by the whitelist — exactly what the
# family's `children_decided_by: [onlist]` carries.
parent: 10x-5p-gex

confusable_with:
  - id: 10x-3p-gex-v3
    relationship: processing_divergent
    distinguishable_by: [onlist]
    note: >
      Same 28 bp / 16+12 geometry, so every structural rung ties. The backends differ in two params —
      soloCBwhitelist (3M-5pgex-jan-2023 vs 3M-february-2018) and soloStrand (Reverse vs Forward) —
      and only the first is observable. It is enough: the two lists share 0.62% of the smaller, so
      rung 3 decides. This is the edge that replaces the old v3 -> `10x-5p-gex` declaration, which
      named a bare family id and claimed `[metadata, alignment]`; both were wrong. The 28 bp partner
      of 3' v3 is 5' v3, not 5' v1/v2, and an onlist separates them.
  - id: 10x-3p-gex-v3.1
    relationship: processing_divergent
    distinguishable_by: [onlist]
    note: >
      v3.1 is byte-identical to v3 (both 3M-february-2018), so this entry diverges from it in exactly
      the same way and by the same measured 0.62% whitelist separation.
  - id: 10x-gemx-3p-v4
    relationship: processing_divergent
    distinguishable_by: [onlist]
    note: >
      The 3' half of the GEM-X generation: same 28 bp geometry, same kit family, opposite end of the
      transcript. 3M-5pgex-jan-2023 and 3M-3pgex-may-2023 share 6.87% of the smaller list — the
      closest pair in this KB, and still an order of magnitude under the 0.6 gate every hit-rate test
      uses, so rung 3 separates them.
  - id: 10x-multiome-gex
    relationship: processing_divergent
    distinguishable_by: [onlist]
    note: >
      The fourth occupant of the 28 bp geometry. 3M-5pgex-jan-2023 and 737K-arc-v1 share ZERO
      barcodes, so this is the cleanest onlist separation in the KB.
